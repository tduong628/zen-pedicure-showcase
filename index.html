<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zen Nail Spa — Pedicure Menu (Display)</title>
<style>
  :root { --slide-w: 1080; --slide-h: 1920; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width:100%; height:100%; background:#0c0b0a; overflow:hidden;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  body { cursor:none; }
  /* Stage: fixed 1080x1920, scaled to fit any portrait screen */
  #stage {
    position:absolute; top:50%; left:50%;
    width:1080px; height:1920px;
    transform-origin:center center;
    overflow:hidden;
    background:#F7ECD8;
  }
  /* Each poster fills the stage; two layers crossfade */
  .layer {
    position:absolute; inset:0;
    opacity:0;
    overflow:hidden;
    background:#F7ECD8;
    transition: opacity 1s ease;
  }
  .layer.active { opacity:1; z-index:2; }
  .layer.reset { transition:none; }
  .layer img {
    position:absolute; inset:0;
    width:100%; height:100%;
    object-fit:contain;
    display:block;
    transform:scale(1);
    transition: transform 12s linear;
    will-change:transform;
  }
  /* Ken Burns: slow drift from 1.0 -> 1.04 across the full on-screen duration */
  .layer.zoom img { transform:scale(1.04); }
  .layer.no-zoom-transition img { transition:none; }
  /* Progress dots */
  #progress {
    position:absolute; bottom:30px; left:50%; transform:translateX(-50%);
    display:flex; gap:14px; z-index:50;
    padding:12px 22px; border-radius:999px;
    background:rgba(20,18,16,0.32);
    backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    opacity:0; transition:opacity .4s ease;
  }
  #stage:hover #progress { opacity:1; }
  .dot {
    width:9px; height:9px; border-radius:50%;
    background:rgba(255,255,255,0.34);
    transition: all .5s ease;
  }
  .dot.on { background:#E8C9A0; width:30px; border-radius:6px; }
  /* Idle hint */
  #hint {
    position:absolute; top:24px; left:50%; transform:translateX(-50%);
    z-index:60; color:rgba(255,255,255,0.7);
    font-size:14px; letter-spacing:.14em; text-transform:uppercase;
    padding:10px 20px; border-radius:999px;
    background:rgba(20,18,16,0.34); backdrop-filter:blur(14px);
    opacity:0; transition:opacity .5s ease; pointer-events:none;
  }
  #stage:hover #hint { opacity:1; }
</style>
</head>
<body>
<div id="stage">
  <div class="layer" id="layA"><img id="imgA" alt=""></div>
  <div class="layer" id="layB"><img id="imgB" alt=""></div>

  <div id="hint">Zen Nail Spa · Pedicure Menu — press F for fullscreen</div>
  <div id="progress"></div>
</div>

<script>
(function () {
  // Poster manifest — each slide is one complete, fully-designed ChatGPT poster image.
  var POSTER_DIR = 'styles/bento/assets/posters/';
  var SLIDES = [
    { src: POSTER_DIR + 'poster-charcoal-detox.png', label: 'Charcoal Detox Pedicure' },
    { src: POSTER_DIR + 'poster-fall-winter.jpg',     label: 'Fall/Winter Pedicure Special' },
    { src: POSTER_DIR + 'poster-honey-orange.png',    label: 'Honey Orange Zest Pedicure' },
    { src: POSTER_DIR + 'poster-herbal.png',          label: 'Zen Herbal Pedicure Ritual' },
    { src: POSTER_DIR + 'poster-romantic-rose.png',   label: 'Romantic Rose Pedicure' },
    { src: POSTER_DIR + 'poster-lavender.png',        label: 'Lavender Spa Pedicure' },
    { src: POSTER_DIR + 'poster-basic-spa.png',       label: 'Basic Spa Pedicure' },
    { src: POSTER_DIR + 'poster-pearl-steam.png',     label: 'The Pearl & Steam Experience' },
    { src: POSTER_DIR + 'poster-green-tea.png',       label: 'Green Tea Pedicure' },
    { src: POSTER_DIR + 'poster-collagen.png',        label: 'Collagen Spa Experience' }
  ];
  var SLIDE_MS = 12000;          // 12s per slide (John's choice)
  var SLIDE_W = 1080, SLIDE_H = 1920;

  var stage = document.getElementById('stage');
  var layers = [
    { el: document.getElementById('layA'), img: document.getElementById('imgA') },
    { el: document.getElementById('layB'), img: document.getElementById('imgB') }
  ];
  var progress = document.getElementById('progress');

  // Build progress dots
  SLIDES.forEach(function (_, i) {
    var d = document.createElement('div');
    d.className = 'dot' + (i === 0 ? ' on' : '');
    progress.appendChild(d);
  });
  var dots = progress.querySelectorAll('.dot');

  // Scale stage to fit viewport, preserving 1080x1920 aspect (portrait)
  function fit() {
    var sw = window.innerWidth, sh = window.innerHeight;
    var scale = Math.min(sw / SLIDE_W, sh / SLIDE_H);
    stage.style.transform = 'translate(-50%,-50%) scale(' + scale + ')';
  }
  window.addEventListener('resize', fit);
  fit();

  var idx = 0;
  var front = 0;

  function loadInto(layer, src, ready) {
    layer.img.onload = function () {
      layer.img.onload = null;
      ready();
    };
    layer.img.onerror = function () {
      layer.img.onerror = null;
      ready();
    };
    layer.img.src = src;
    if (layer.img.complete && layer.img.naturalWidth > 0) {
      layer.img.onload = null;
      layer.img.onerror = null;
      ready();
    }
  }

  function startZoom(layer) {
    // Snap the zoom transform back to 1x with no transition, then re-enable
    // the transition and kick off the slow drift to 1.04x for the full
    // on-screen duration of this slide.
    layer.el.classList.add('no-zoom-transition');
    layer.el.classList.remove('zoom');
    void layer.img.offsetWidth;
    layer.el.classList.remove('no-zoom-transition');
    requestAnimationFrame(function () {
      layer.el.classList.add('zoom');
    });
  }

  function go(next) {
    var back = 1 - front;
    var incoming = layers[back];
    var outgoing = layers[front];
    incoming.el.className = 'layer reset';
    loadInto(incoming, SLIDES[next].src, function () {
      void incoming.el.offsetWidth;
      incoming.el.className = 'layer';
      requestAnimationFrame(function () {
        incoming.el.classList.add('active');
        startZoom(incoming);
        outgoing.el.classList.remove('active');
        front = back;
        idx = next;
        dots.forEach(function (d, i) { d.classList.toggle('on', i === idx); });
      });
    });
  }

  function tick() { go((idx + 1) % SLIDES.length); }

  var timer = null;
  function start() { stop(); timer = setInterval(tick, SLIDE_MS); }
  function stop() { if (timer !== null) { clearInterval(timer); timer = null; } }

  // Prime the first slide, then begin the auto-advance loop unconditionally.
  loadInto(layers[0], SLIDES[0].src, function () {
    layers[0].el.className = 'layer active';
    startZoom(layers[0]);
    start();
  });

  function toggleFs() {
    var result;
    try {
      if (!document.fullscreenElement) {
        if (document.documentElement.requestFullscreen) {
          result = document.documentElement.requestFullscreen();
        }
      } else if (document.exitFullscreen) {
        result = document.exitFullscreen();
      }
      if (result && result.catch) result.catch(function () {});
    } catch (_) {
      // Fullscreen may be unavailable in the current browser.
    }
  }
  document.addEventListener('keydown', function (e) {
    if (e.key.toLowerCase() === 'f') toggleFs();
  });
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) stop(); else start();
  });
})();
</script>
</body>
</html>
