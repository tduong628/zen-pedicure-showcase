<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zen Nail Spa — Pedicure Menu (Display)</title>
<style>
  :root { --slide-w: 1080; --slide-h: 1920; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width:100%; height:100%; background:#0c0b0a; overflow:hidden;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  body { cursor:none; }
  /* Stage: fixed 1080x1920, scaled to fit any portrait screen */
  #stage {
    position:absolute; top:50%; left:50%;
    width:1080px; height:1920px;
    transform-origin:center center;
    overflow:hidden;
    background:#F5E6D8;
  }
  .layer {
    position:absolute; inset:0;
    opacity:0;
    transform:translateX(100%);
    transition:transform 1.1s cubic-bezier(0.65,0,0.35,1), opacity 1.1s ease;
    will-change:transform, opacity;
    pointer-events:none;
  }
  .layer.active { opacity:1; transform:translateX(0); }
  .layer.leaving { opacity:0.65; transform:translateX(-100%); }
  .layer.reset { transition:none; }
  .layer iframe {
    width:1080px; height:1920px; border:0; display:block;
    background:#F5E6D8;
  }
  /* Progress dots */
  #progress {
    position:absolute; bottom:30px; left:50%; transform:translateX(-50%);
    display:flex; gap:14px; z-index:50;
    padding:12px 22px; border-radius:999px;
    background:rgba(20,18,16,0.32);
    backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    opacity:0; transition:opacity .4s ease;
  }
  #stage:hover #progress { opacity:1; }
  .dot {
    width:9px; height:9px; border-radius:50%;
    background:rgba(255,255,255,0.34);
    transition: all .5s ease;
  }
  .dot.on { background:#E8C9A0; width:30px; border-radius:6px; }
  /* Idle hint */
  #hint {
    position:absolute; top:24px; left:50%; transform:translateX(-50%);
    z-index:60; color:rgba(255,255,255,0.7);
    font-size:14px; letter-spacing:.14em; text-transform:uppercase;
    padding:10px 20px; border-radius:999px;
    background:rgba(20,18,16,0.34); backdrop-filter:blur(14px);
    opacity:0; transition:opacity .5s ease; pointer-events:none;
  }
  #stage:hover #hint { opacity:1; }
</style>
</head>
<body>
<div id="stage">
  <div class="layer" id="layA"><iframe id="frA" title="slide A"></iframe></div>
  <div class="layer" id="layB"><iframe id="frB" title="slide B"></iframe></div>

  <div id="hint">Zen Nail Spa · Pedicure Menu — press F for fullscreen</div>
  <div id="progress"></div>
</div>

<script>
(function () {
  // Slide manifest matches zen-slideshow.html.
  var SLIDES = [
    { src: "styles/bento/index.html",                    label: "Charcoal Detox Pedicure" },
    { src: "styles/bento/slide-02-summer-pedicure.html",  label: "Fall/Winter Pedicure Special" },
    { src: "styles/bento/slide-03-honey-orange.html",     label: "Honey Orange Zest Pedicure" },
    { src: "styles/bento/slide-04-zen-herbal.html",       label: "Zen Herbal Pedicure Ritual" },
    { src: "styles/bento/slide-05-romantic-rose.html",    label: "Romantic Rose Pedicure" },
    { src: "styles/bento/slide-06-lavender-spa.html",     label: "Lavender Spa Pedicure" },
    { src: "styles/bento/slide-07-basic-spa.html",        label: "Basic Spa Pedicure" },
    { src: "styles/bento/slide-08-pearl-steam.html",      label: "The Pearl & Steam Experience" },
    { src: "styles/bento/slide-09-green-tea.html",        label: "Green Tea Pedicure" },
    { src: "styles/bento/slide-10-collagen-spa.html",     label: "Collagen Spa Experience" }
  ];
  var SLIDE_MS = 12000;          // 12s per slide (John's choice)
  var SLIDE_W = 1080, SLIDE_H = 1920;

  var stage = document.getElementById('stage');
  var layers = [
    { el: document.getElementById('layA'), fr: document.getElementById('frA') },
    { el: document.getElementById('layB'), fr: document.getElementById('frB') }
  ];
  var progress = document.getElementById('progress');

  // Build progress dots
  SLIDES.forEach(function (_, i) {
    var d = document.createElement('div');
    d.className = 'dot' + (i === 0 ? ' on' : '');
    progress.appendChild(d);
  });
  var dots = progress.querySelectorAll('.dot');

  // Scale stage to fit viewport, preserving 1080x1920 aspect (portrait)
  function fit() {
    var sw = window.innerWidth, sh = window.innerHeight;
    var scale = Math.min(sw / SLIDE_W, sh / SLIDE_H);
    stage.style.transform = 'translate(-50%,-50%) scale(' + scale + ')';
  }
  window.addEventListener('resize', fit);
  fit();

  var idx = 0;
  var front = 0;
  var timer = null;
  var busy = false;

  function load(layer, src, ready) {
    // Install the handler before navigating, including for cached local files.
    layer.fr.onload = function () {
      layer.fr.onload = null;
      // Allow the slide's entrance animation and first paint to begin.
      setTimeout(function () {
        requestAnimationFrame(function () {
          requestAnimationFrame(ready);
        });
      }, 420);
    };
    layer.fr.src = src;
  }

  function go(next) {
    if (busy || document.hidden) return;
    busy = true;
    var back = 1 - front;
    var incoming = layers[back];
    var outgoing = layers[front];
    incoming.el.className = 'layer reset';
    load(incoming, SLIDES[next].src, function () {
      // Commit the offscreen position before enabling the transition.
      void incoming.el.offsetWidth;
      incoming.el.className = 'layer';
      requestAnimationFrame(function () {
        incoming.el.classList.add('active');
        outgoing.el.className = 'layer leaving';
        front = back;
        idx = next;
        dots.forEach(function (d, i) { d.classList.toggle('on', i === idx); });
        setTimeout(function () {
          outgoing.el.className = 'layer reset';
          outgoing.fr.onload = null;
          outgoing.fr.src = 'about:blank';
          busy = false;
        }, 1200);
      });
    });
  }

  function tick() { go((idx + 1) % SLIDES.length); }
  function start() {
    stop();
    if (!document.hidden) timer = setInterval(tick, SLIDE_MS);
  }
  function stop() {
    if (timer !== null) { clearInterval(timer); timer = null; }
  }

  load(layers[0], SLIDES[0].src, function () {
    layers[0].el.className = 'layer reset active';
    start();
  });

  function toggleFs() {
    var result;
    try {
      if (!document.fullscreenElement) {
        if (document.documentElement.requestFullscreen) {
          result = document.documentElement.requestFullscreen();
        }
      } else if (document.exitFullscreen) {
        result = document.exitFullscreen();
      }
      if (result && result.catch) result.catch(function () {});
    } catch (_) {
      // Fullscreen may be unavailable in the current browser.
    }
  }
  document.addEventListener('keydown', function (e) {
    if (e.key.toLowerCase() === 'f') toggleFs();
  });
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) stop(); else start();
  });
})();
</script>
</body>
</html>
